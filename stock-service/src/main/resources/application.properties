spring.application.name=ProjectNifi

# Matches the :8081 stock-service is assigned in docs/plan.md's architecture
# diagram (sector-service takes :8082, notification-service :8083). Without
# this it silently falls back to Spring Boot's default of 8080.
server.port=8081

# Fixed (rather than random) in-memory DB name + H2 console, purely for local
# manual verification via curl/Postman + the H2 console during development.
spring.datasource.url=jdbc:h2:mem:stockservice
spring.h2.console.enabled=true

# Error-response hardening. GlobalExceptionHandler already curates every error
# from a controller, but these lock down the fallback /error path too, so even
# an error raised outside a controller (filter, static resource, etc.) can't
# leak internals. "never" is the Spring Boot default for all three; pinned
# explicitly so a future dependency/config change can't silently loosen it.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Base URL for sector-service, called synchronously (Spring's built-in
# RestClient, see config/RestClientConfig.java) to validate a Stock's sector
# exists before it's saved. Matches the :8082 sector-service is assigned in
# docs/plan.md's architecture diagram.
sector-service.base-url=http://localhost:8082

# RabbitMQ connection (see config/RabbitConfig.java for the exchange/queue
# topology). port/username/password already match Spring Boot's own defaults
# and the repo root's docker-compose.yml (rabbitmq:management image, default
# guest/guest credentials, local-only use) — pinned explicitly anyway so the
# connection target is visible here rather than relying on defaults. host is
# 127.0.0.1 rather than localhost: on this dev machine "localhost" resolves
# to the IPv6 loopback (::1) first, which Docker's port publishing doesn't
# bind, so the connection attempt fails; RabbitAdmin swallows that failure
# silently at startup (defers declaration until a connection later succeeds,
# which never happens without a listener/publish forcing one) rather than
# raising a visible error, so the failure mode was a "missing" exchange/queue
# with no error in the logs, not a crash.
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

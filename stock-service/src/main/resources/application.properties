spring.application.name=ProjectNifi

# Matches the :8081 stock-service is assigned in docs/plan.md's architecture
# diagram (sector-service takes :8082, notification-service :8083). Without
# this it silently falls back to Spring Boot's default of 8080.
server.port=8081

# Fixed (rather than random) in-memory DB name + H2 console, purely for local
# manual verification via curl/Postman + the H2 console during development.
spring.datasource.url=jdbc:h2:mem:stockservice
spring.h2.console.enabled=true

# Error-response hardening. GlobalExceptionHandler already curates every error
# from a controller, but these lock down the fallback /error path too, so even
# an error raised outside a controller (filter, static resource, etc.) can't
# leak internals. "never" is the Spring Boot default for all three; pinned
# explicitly so a future dependency/config change can't silently loosen it.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

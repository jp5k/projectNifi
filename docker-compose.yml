# Local infrastructure for the Messaging & Dataflow milestone (see
# docs/plan.md) — RabbitMQ (the broker stock-service publishes
# StockPriceUpdate events to) and Apache NiFi (consumes the same stream,
# reshapes it with the XSLT stylesheet in nifi/xslt/). Neither service is a
# Spring Boot app, so they don't belong in the Maven build — just local infra,
# started/stopped independently of `./mvnw`.
#
# Usage:
#   docker compose up -d      # start both in the background
#   docker compose logs -f    # tail logs (nifi in particular takes a while
#                              # to finish booting on first start)
#   docker compose down       # stop and remove both containers

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: projectnifi-rabbitmq
    ports:
      # AMQP port stock-service (and later notification-service) connect to.
      - "5672:5672"
      # Management UI — http://localhost:15672 (guest/guest, the image's
      # default credentials; fine for local-only use, never exposed
      # externally).
      - "15672:15672"

  nifi:
    image: apache/nifi:1.27.0
    container_name: projectnifi-nifi
    ports:
      # Plain HTTP UI — http://localhost:8080/nifi. The image defaults to
      # HTTPS with an auto-generated single-user login buried in the boot
      # logs; HTTP is simpler for local dev and is the alternative port the
      # architecture diagram in docs/plan.md already allows for. Doesn't
      # collide with stock-service (:8081), sector-service (:8082), or
      # notification-service (:8083).
      - "8080:8080"
    environment:
      NIFI_WEB_HTTP_PORT: "8080"
    volumes:
      # Where the flow's PutFile processor writes consumed StockPriceUpdate
      # events, so they're inspectable from the host without a shell into the
      # container. The image runs as uid 1000, matching the host user here,
      # so no permission fixup is needed.
      - ./nifi/output:/opt/nifi/output

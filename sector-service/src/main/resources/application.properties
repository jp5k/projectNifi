spring.application.name=sector-service

# Matches the :8082 sector-service is assigned in docs/plan.md's architecture
# diagram (stock-service is :8081, notification-service :8083). Without this
# it silently falls back to Spring Boot's default of 8080, colliding with
# whichever other module started first.
server.port=8082

# Fixed (rather than random) in-memory DB name + H2 console, purely for local
# manual verification via curl/Postman + the H2 console during development.
# Distinct from stock-service's jdbc:h2:mem:stockservice so the two modules'
# in-memory databases never collide when run side by side.
spring.datasource.url=jdbc:h2:mem:sectorservice
spring.h2.console.enabled=true

# Error-response hardening, matching stock-service's application.properties:
# these are already the Spring Boot defaults, pinned explicitly so a future
# dependency/config change can't silently loosen them.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
